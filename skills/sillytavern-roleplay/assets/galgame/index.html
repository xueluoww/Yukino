<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在场景中与角色相遇，自由推进属于你的故事。">
  <title>Yukino · 剧本剧场</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css"><script src="music.js" defer></script><script src="app.js" defer></script><script src="save-map.js" defer></script><script src="engine-ui.js" defer></script><link rel="stylesheet" href="engine-ui.css">
</head>
<body>
  <section id="lobby" aria-label="剧本与存档选择">
    <div class="lobby-header"><div class="wordmark"><span class="snow">❄</span><span>Yukino</span><small>0.8</small></div><div class="lobby-actions"><span id="library-count"></span><button id="lobby-manage-saves">存档管理</button></div></div>
    <div id="character-picker" class="character-picker">
      <div class="picker-heading"><span class="eyebrow">SCRIPTS</span><h1>选择剧本</h1><p>选择一个世界，从一次相遇开始。</p></div>
      <div class="selection-layout"><div id="character-roster" class="character-roster" aria-label="剧本选择"></div>
        <article class="character-intro"><span class="eyebrow">PROFILE</span><h2 id="selected-name"></h2><div class="small-divider"></div><p id="selected-bio"></p><h3>开场场景</h3><p id="selected-scene"></p><h3>登场人物</h3><p id="selected-cast"></p><button id="view-script-cards" class="catalog-entry">查看人物卡 <span>↗</span></button><button id="choose-story-button" class="primary">选择存档与场景 <span>◇</span></button></article>
      </div>
    </div>
    <div id="story-picker" class="story-picker" hidden>
      <button id="back-to-characters" class="back-button">返回剧本选择</button>
      <div class="story-layout"><aside class="story-character"><img id="story-sprite" alt="已选择剧本的立绘"><h2 id="story-character-name"></h2></aside>
        <section class="story-options"><span class="eyebrow">YOUR STORY</span><h1>选择故事</h1>
          <div class="story-tabs"><button id="new-story-tab" class="selected">新建存档</button><button id="saved-story-tab">继续存档</button></div>
          <div id="new-story-pane"><label class="player-name">你的称呼<input id="player-name" maxlength="80" value="你"></label><div class="world-picker"><select id="world-select" hidden aria-label="剧本世界观"></select><p id="world-description" class="hint"></p><select id="setting-select" hidden aria-label="剧本设定集" multiple></select><p id="script-settings-summary" class="hint"></p><label>主角卡<select id="protagonist-select" aria-label="主角卡"></select></label></div><button id="view-protagonist-cards" class="catalog-entry">查看主角卡 <span>↗</span></button><h3>选择开场场景</h3><div id="scenario-list"></div><div class="start-actions"><button id="begin-story" class="primary">新建存档并开始</button><button id="preview-story">先试读</button></div></div>
          <div id="saved-story-pane" hidden><div id="saved-stories"></div></div>
        </section>
      </div>
    </div>
    <p id="lobby-notice" role="status"></p>
  </section>
  <section id="save-map-screen" aria-label="存档分支页面" hidden>
    <header class="save-map-header"><div><span class="eyebrow">STORY BRANCHES</span><h1 id="save-map-title"></h1><p id="save-map-count"></p></div><div class="save-map-controls"><button id="save-map-latest">定位最近存档</button><button id="save-map-exit">退出分支图</button></div></header>
    <div id="save-map-viewport" tabindex="0" aria-label="可拖动的横向存档分支图"><div id="save-map-canvas"></div></div>
    <footer class="save-map-footer"><label for="save-map-scroll">拖动查看故事线</label><input id="save-map-scroll" type="range" min="0" max="0" value="0" step="1" aria-label="横向拖动故事线"><small>拖动空白处移动 · 点击存档继续 · Esc 返回</small></footer>
  </section>
  <main id="game" aria-label="视觉小说" hidden>
    <div class="backdrop" id="background"></div><div class="scene-light"></div><div class="vignette"></div>
    <div class="particles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <img id="sprite" class="sprite" alt="角色立绘" hidden>
    <header class="topbar interface">
      <div class="wordmark"><span class="snow">❄</span><span>Yukino</span><small>0.8</small><span id="story-clock"></span></div>
      <div class="chapter"><span id="location">秋日 · 侍奉部</span><span class="chapter-line"></span><span id="mode">试读</span></div>
      <nav aria-label="游戏菜单">
        <button id="music-button" aria-label="静音背景音乐" aria-pressed="true" title="背景音乐">♫</button><button id="thought-button" aria-expanded="false" aria-controls="thought-panel">心声</button><button id="affinity-button">好感</button><button id="plot-button">脉络</button><button id="log-button" title="对话记录">回看</button><button id="gallery-button">画廊</button><button id="save-button">存档</button><button id="gameplay-button">手记</button><button id="manage-saves-button">管理</button><button id="menu-button" aria-label="打开设置">⋯</button>
      </nav>
    </header>
    <div class="scene-caption interface"><span id="chapter-number">CHAPTER 01</span><p id="chapter-title">初次相遇</p><div></div></div>
    <button id="restore-ui" hidden>显示对话</button>
    <aside id="transition" class="scene-transition interface" hidden role="status"><span class="transition-path" aria-hidden="true"><i></i><i></i><i></i></span><div><small id="transition-label">转场</small><p id="transition-target"></p></div><button id="retry-image" hidden>重试画面</button></aside>
    <aside id="cg-wait" class="cg-wait interface" aria-label="剧情插图" role="status" hidden><span class="thinking-orbit" aria-hidden="true"><i></i><i></i><i></i></span><small>剧情插图</small><h3 id="cg-wait-title"></h3><p id="cg-wait-status"></p><div><button id="cg-continue" hidden>欣赏完毕 · 继续故事</button><button id="cg-retry" hidden>重新等待画面</button><button id="cg-skip">先继续故事</button></div></aside>
    <aside id="thought-panel" class="thought-panel interface" aria-label="人物心声" hidden><header><span>人物心声</span><button id="close-thoughts" aria-label="收起人物心声">×</button></header><div id="export-thoughts"></div><div id="thought-list"></div></aside>
    <section class="dialogue-wrap interface" aria-label="对话">
      <aside id="receipt" class="receipt" role="status" aria-live="polite" hidden><div><small id="receipt-name"></small><p id="receipt-text"></p></div><span id="receipt-stage"></span><button id="retry-turn" hidden>重试</button></aside>
      <div id="waiting" class="waiting" role="status" hidden><span class="thinking-orbit" aria-hidden="true"><i></i><i></i><i></i></span><span id="waiting-text"></span><small id="waiting-time"></small></div>
      <div class="speaker-row"><div class="speaker-tag"><span class="speaker-mark"></span><span id="speaker">旁白</span></div><button id="affinity-badge" hidden aria-label="查看人物好感度"></button><span id="frame-count">01 / 03</span></div>
      <div class="dialogue-panel">
        <div class="portrait" id="portrait-wrap"><img id="avatar" alt="人物头像"></div>
        <div class="dialogue-content"><div id="dialogue" role="status" aria-live="polite"></div><div class="dialogue-bottom"><span id="status">点击继续 · 空格</span><button id="next-button" aria-label="继续对话">继续 <span aria-hidden="true">◇</span></button></div></div>
      </div>
      <div class="input-prefixes" role="group" aria-label="输入内容类型"><button type="button" data-prefix="语言" aria-label="插入语言前缀">语言</button><button type="button" data-prefix="动作" aria-label="插入动作前缀">动作</button><button type="button" data-prefix="环境" aria-label="插入环境前缀">环境</button><button type="button" data-prefix="内心" aria-label="插入内心前缀">内心</button><small>可混合使用 · 内心不会说出口</small></div>
      <form id="input-form" class="input-row"><label class="sr-only" for="message">你的台词或动作</label><span class="input-mark" aria-hidden="true">✧</span><textarea id="message" rows="1" maxlength="8000" placeholder="【语言】说的话　【动作】你的行动　【环境】当前场景　【内心】没有说出口的想法"></textarea><button id="send-button" type="submit">回应 <span aria-hidden="true">↵</span></button></form>
      <div id="choices" class="choices" aria-label="可选回应" hidden></div>
      <div class="footer-controls"><span id="save-state">当前为试读，点击存档可保存完整剧情</span><div><button id="auto-button" aria-pressed="false">自动</button><button id="hide-button">隐藏界面</button><button id="fullscreen-button">全屏</button></div></div>
    </section>
    <aside id="toast" role="status" hidden></aside>
  </main>
    <dialog id="modal"><div class="modal-header"><div><span class="eyebrow">0.8</span><h2 id="modal-title"></h2></div><button id="close-modal" aria-label="关闭弹窗">×</button></div><div id="modal-body"></div></dialog>
</body>
</html>
